<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grading & Validation Engine</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light vh-100 d-flex flex-column justify-content-center align-items-center">

  <div class="card p-4 shadow-sm" style="width: 450px;">

    <h3 class="card-title text-center mb-4">
      Grading & Validation Engine
    </h3>

    <div class="mb-3">
      <label for="midterm-input" class="form-label">
        Midterm Score (0-100):
      </label>

      <input
        type="text"
        id="midterm-input"
        class="form-control"
        placeholder="e.g. 85">
    </div>

    <div class="mb-3">
      <label for="finals-input" class="form-label">
        Finals Score (0-100):
      </label>

      <input
        type="text"
        id="finals-input"
        class="form-control"
        placeholder="e.g. 90">
    </div>

    <button
      id="compute-btn"
      class="btn btn-success w-100 mb-4">
      Compute Grade Matrix
    </button>

    <div
      class="p-3 bg-white border rounded text-center"
      id="output-matrix">

      <p class="text-muted m-0">
        Awaiting system input computation...
      </p>

    </div>

  </div>

<script>
  
const midtermInput = document.getElementById("midterm-input");
const finalsInput = document.getElementById("finals-input");
const computeBtn = document.getElementById("compute-btn");
const outputMatrix = document.getElementById("output-matrix");

function calculateGradePayload() {
    const midtermValue = midtermInput.value.trim();
    const finalsValue = finalsInput.value.trim();

    if (midtermValue === "" || finalsValue === "") {
        outputMatrix.innerHTML = "<strong class='text-danger'>Error: Please enter a valid number.</strong>";
        return;
    }

    const midtermScore = Number(midtermValue);
    const finalsScore = Number(finalsValue);

    if (isNaN(midtermScore) || isNaN(finalsScore) || midtermScore < 0 || finalsScore < 0 || midtermScore > 100 || finalsScore > 100) {
        outputMatrix.innerHTML = "<strong class='text-danger'>Error: You have entered an invalid input.</strong>";
        return;
    }

    const averageScore = (midtermScore * 0.45) + (finalsScore * 0.55);
    let statusText = "";
    let statusColorClass = "";

    if (averageScore >= 100) {
    statusText = "Perfect A+";
    statusColorClass = "text-success";

} else if (averageScore >= 96) {
    statusText = "A";
    statusColorClass = "text-success";

} else if (averageScore >= 91) {
    statusText = "B";
    statusColorClass = "text-success";

} else if (averageScore >= 86) {
    statusText = "C";
    statusColorClass = "text-success";

} else if (averageScore >= 81) {
    statusText = "D";
    statusColorClass = "text-warning";

} else if (averageScore >= 75) {
    statusText = "E";
    statusColorClass = "text-warning";

} else {
    statusText = "Failed";
    statusColorClass = "text-danger";
}

    outputMatrix.innerHTML = "<h4> Final Grades: " + averageScore.toFixed(2) + "</h4>" +
                             "<h1 class='display-4 " + statusColorClass + " font-bold'>" + statusText + "</h1>";
}

computeBtn.addEventListener("click", calculateGradePayload);
</script>
